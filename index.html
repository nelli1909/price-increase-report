<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Повышение цен · октябрь 2026</title>
<style>
:root{
  --green:#2DBE64; --green-d:#1E8A4A; --green-ink:#13532D; --green-50:#F1FAF4; --green-100:#DDF3E5;
  --fc:#A3DDB9; --fact:#1E8A4A;
  --ink:#1D2821; --ink2:#44524A; --muted:#78867D; --line:#E2E9E4; --grid:#EDF1EE; --bg:#EEF2EF;
  --berry:#D7144B; --neg:#E5484D; --warn-bg:#FFF6DC; --warn-ink:#7A5A00;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#side{position:fixed;left:0;top:0;bottom:0;width:270px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:20;transition:width .25s}
#side.collapsed{width:58px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 14px 12px;border-bottom:1px solid var(--line)}
.side-head img{height:18px;overflow:hidden}
#side.collapsed .side-head{justify-content:center;padding:16px 0 12px}
#side.collapsed .side-head img{display:none}
.side-btn{border:1px solid var(--line);background:#fff;color:var(--ink2);height:30px;min-width:30px;border-radius:9px;cursor:pointer;font-size:14px;padding:0 8px;font-family:inherit}
.side-btn:hover{background:var(--green-50);border-color:var(--green)}
.side-btn.on{background:var(--green-ink);border-color:var(--green-ink);color:#fff}
#navList{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 10px 16px}
.nav-group{margin:14px 0 4px;padding:4px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;margin-bottom:2px;border:0;border-radius:11px;background:transparent;
  color:var(--ink2);font:600 12.5px/1.25 inherit;font-family:inherit;text-align:left;cursor:pointer}
.nav-item:hover{background:var(--green-50)}
.nav-item.active{background:var(--green-ink);color:#fff}
.nav-num{flex:none;width:20px;height:20px;border-radius:50%;background:#E8EEEA;color:var(--muted);font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.nav-item.active .nav-num{background:var(--green);color:#fff}
#side.collapsed .nav-label,#side.collapsed .nav-group{display:none}
#side.collapsed .nav-item{justify-content:center;padding:7px 0}
.side-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.side-foot .side-btn{flex:1;font-size:12.5px}
#side.collapsed .side-foot{flex-direction:column;padding:10px 8px}
#side.collapsed .side-foot .side-btn{font-size:0;padding:0}
#side.collapsed .side-foot .side-btn:before{font-size:14px;content:attr(data-i)}
#main{position:fixed;left:270px;right:0;top:0;bottom:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;
  scroll-behavior:smooth;transition:left .25s}
body.nav-collapsed #main{left:58px}
.sl-wrap{position:relative;margin:0 auto;scroll-snap-align:start;scroll-margin-top:16px}
.sl-pad{height:16px}
.deck{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left}
.slide{position:absolute;inset:0;background:#fff;border-radius:10px;box-shadow:0 6px 28px rgba(20,60,35,.14);overflow:hidden}
#progress{position:fixed;top:0;right:0;height:3px;background:var(--green);transition:width .25s;z-index:30}

/* шапка / подвал контентного слайда */
.hdr{position:absolute;left:40px;right:40px;top:24px;height:64px;border-bottom:2px solid var(--green)}
.hdr h1{margin:0;font-size:26px;line-height:1.15;color:var(--green-ink);font-weight:700;padding-right:170px}
.hdr .sub{margin-top:4px;font-size:14px;color:var(--muted)}
.hdr img{position:absolute;right:0;top:4px;height:18px}
.body{position:absolute;left:40px;right:40px;top:104px;bottom:40px}
.ftr{position:absolute;left:40px;right:40px;bottom:12px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.demo-flag{position:absolute;right:40px;top:58px;font-size:11px;font-weight:700;color:var(--berry);letter-spacing:.04em;text-transform:uppercase}

/* титульный */
.title-bg{position:absolute;inset:0;background:var(--green);clip-path:polygon(0 0,100% 0,100% 86%,89% 66%,0 79%)}
.title-txt{position:absolute;left:64px;top:92px;right:64px;color:#fff}
.title-txt .k{font-size:22px;opacity:.9;letter-spacing:.02em}
.title-txt h1{font-size:60px;line-height:1.05;margin:10px 0 18px;font-weight:800}
.title-txt .m{font-size:30px;font-weight:600}
.title-txt .d{font-size:17px;opacity:.9;margin-top:8px}
.title-logo{position:absolute;left:64px;bottom:44px;height:44px}
.title-status{position:absolute;right:64px;bottom:52px;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
  background:var(--warn-bg);color:var(--warn-ink);font-size:15px;font-weight:600}
.title-status.ok{background:var(--green-100);color:var(--green-ink)}
.title-status.demo{background:#FBE3EA;color:var(--berry)}

/* карточки */
.kpi-grid{display:grid;gap:12px}
.kpi-card{min-width:0;padding:16px 18px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 10px 34px rgba(51,51,51,.04)}
.kpi-card span{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
.kpi-card strong{display:block;font-size:30px;letter-spacing:-.03em;white-space:nowrap;color:var(--ink)}
.kpi-card em{display:block;margin-top:6px;font-size:12.5px;font-style:normal;color:var(--ink2)}

.ch-panel{border:1px solid var(--line);border-radius:22px;padding:18px 22px 16px;background:#fff;box-shadow:0 14px 40px rgba(51,51,51,.05);display:flex;flex-direction:column;min-height:0}
.ch-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.ch-head h2{margin:0;font-size:24px;color:var(--green-ink);display:flex;align-items:center;gap:12px}
.ch-badge{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--green-100);color:var(--green-d);font-size:17px}
.ch-meta{font-size:13px;color:var(--muted);text-align:right;line-height:1.35}
.ch-meta b{color:var(--ink);font-size:15px}

/* таблица-карточка прогноз/факт */
.pf{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.pf th{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:right;padding:0 8px 8px}
.pf th:first-child{text-align:left;padding-left:0}
.pf td{padding:14px 8px;text-align:right;border-top:1px solid var(--line);font-size:15px;white-space:nowrap}
.pf td:first-child{text-align:left;padding-left:0;font-size:14px;color:var(--ink2);white-space:normal}
.pf td.f{font-weight:700;font-size:19px;color:var(--ink)}
.pf td.a{font-weight:700;font-size:19px;color:var(--fact)}
.pf td.wait{color:var(--muted);font-size:13px;font-weight:500}
.pf td.up{color:var(--green-d);font-weight:600}
.pf td.down{color:var(--berry);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}

.two-ch{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:100%}
.two-ch.cat{height:calc(100% - 34px)}
.two-ch.cat .ch-panel{padding:12px 18px}
.ch-head.sm{margin-bottom:6px}
.ch-head.sm h2{font-size:20px}
.ch-head.sm .ch-badge{width:32px;height:32px;font-size:15px}
.ch-head.sm .ch-meta{font-size:13px;font-weight:600;color:var(--ink2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;flex:1;min-height:0}
.mcard{border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;background:#fff;box-shadow:0 10px 34px rgba(51,51,51,.04);display:flex;flex-direction:column}
.mcard .mt{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--green-d);margin-bottom:6px}
.mrow{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.mrow .k{width:78px;flex:none;font-size:12.5px;color:var(--muted);padding-top:5px}
.mvals{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.mvals.a{color:var(--fact)}
.mvals .wait{font-size:14px;font-weight:500;color:var(--muted);padding-top:3px}
.mnote{margin-top:6px;font-size:12.5px;color:var(--muted)}
.mdev{margin-top:auto;padding-top:9px;border-top:1px solid var(--line);font-size:13px;font-weight:600}
.mdev .up{color:var(--green-d)} .mdev .down{color:var(--berry)} .mdev .wait{color:var(--muted);font-weight:500}
/* метод */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{min-height:200px}
.step{border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;background:var(--green-50)}
.step .n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:15px;margin-bottom:10px}
.step h3{margin:0 0 6px;font-size:17px;color:var(--green-ink)}
.step p{margin:0;font-size:14.5px;line-height:1.45;color:var(--ink2)}
.two-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:18px;padding:14px 18px;background:#fff}
.card h3{margin:0 0 8px;color:var(--green-ink);font-size:17px}
.card ul{margin:0;padding-left:20px;font-size:15px;line-height:1.55;color:var(--ink2)}
.callout{margin-top:16px;display:flex;gap:16px;align-items:center;padding:14px 20px;border-radius:18px;background:var(--green-ink);color:#fff;font-size:15px;line-height:1.45}
.callout b{color:#B9F0CD}
.callout .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-weight:800;font-size:20px}

/* графики */
.chart{position:relative}
.chart svg{display:block;overflow:visible}
.ttl{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 4px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:12.5px;line-height:1.55;white-space:nowrap;display:none;z-index:5}
.tip b{font-weight:600}
.tip .sw{width:10px;height:10px;margin-right:6px}
.legend{display:flex;gap:22px;font-size:13px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px}
.legend i.dash{background:none;border:1.5px dashed #B9C4BD}
.chart-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chart-top .hint{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:30px 0}

/* выводы */
.concl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.concl .it{border:1.5px dashed #C9D6CD;border-radius:18px;padding:16px 18px;min-height:150px}
.concl.done .it{border:1px solid var(--line);background:#fff;min-height:0}
.concl.done .it p b{color:var(--green-ink)}
.two-ch.prod{height:auto}
.two-ch.prod .ch-panel{padding-bottom:8px}
.concl .it h3{margin:0 0 8px;font-size:17px;color:var(--green-ink);display:flex;align-items:center;gap:10px}
.concl .it h3 .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--green-100);color:var(--green-d);font-size:13px;font-weight:800}
.concl .it p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink2)}
.concl .it p i{color:var(--muted)}

@media print{
  @page{size:1280px 720px;margin:0}
  html,body{background:#fff}
  #side,#progress,.sl-pad{display:none}
  #main{position:static;overflow:visible;scroll-snap-type:none}
  .sl-wrap{width:1280px!important;height:auto!important;margin:0;page-break-after:always}
  .deck{position:static;transform:none!important;width:auto;height:auto!important}
  .slide{position:relative;width:1280px;height:720px;box-shadow:none;border-radius:0}
  .tip{display:none!important}
}

/* Аккуратная типографика слайдов 5–9. Остальные слайды без изменений. */
.slide.polished .hdr{border-bottom-color:#2DBE64}
.slide.polished .ch-panel{box-shadow:none;background:#fff;border-color:#DFEAE2;border-radius:20px}
.slide.polished .chart-top{height:28px;margin-bottom:8px}
.slide.polished .legend{gap:20px;font-size:13px}
.slide.polished .chart-top .hint{font-size:12px;color:#66776C}
.slide.polished .chart-shell{height:calc(100% - 36px);padding:12px 14px 10px;overflow:visible}
.slide.polished .chart svg{font-family:"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums}
.slide.polished .ch-head{margin-bottom:13px;padding:0 2px 12px;border-bottom:1px solid #E4ECE6}
.slide.polished .ch-meta{color:#66776C;font-size:13px}
.slide.polished .ch-badge{background:#EAF6EE}
.slide.polished .mgrid{gap:12px}
.slide.polished .mcard{padding:14px 15px 12px;border:1px solid #E1EBE4;border-radius:16px;box-shadow:none;background:linear-gradient(145deg,#F6FAF7,#FFFFFF 65%)}
.slide.polished .mt{font-size:14px;line-height:1.22;font-weight:650;letter-spacing:0;text-transform:none;color:#365943;min-height:34px;margin-bottom:4px}
.slide.polished .mrow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;margin-top:7px;align-items:start}
.slide.polished .mrow .k{width:auto;padding-top:7px;font-size:11.5px;color:#748378;white-space:nowrap}
.slide.polished .mrow .sw{width:7px;height:7px;margin-right:4px;border-radius:2px}
.slide.polished .mvals{font-size:27px;font-weight:700;line-height:1.15;letter-spacing:-.7px;color:#194D2E;font-variant-numeric:tabular-nums}
.slide.polished .mvals .value-secondary{font-size:14px;font-weight:500;letter-spacing:0;color:#68796E;margin-top:5px;line-height:1.25}
.slide.polished .mvals .number-unit{font-size:15px;font-weight:600;letter-spacing:0;margin-left:2px;white-space:nowrap}
.slide.polished .mvals.a{color:#1E8A4A}
.slide.polished .mvals .wait{font-size:12px;font-weight:500;letter-spacing:0;background:#EDF3EF;border-radius:6px;padding:5px 8px;display:inline-block;margin-top:2px;color:#7B8A80}
.slide.polished .mdev{font-size:11.5px;line-height:1.4;padding-top:10px;border-top-color:#DFE9E2;font-weight:500}
.slide.polished .mdev .wait{color:#839188}
.slide.polished .ch-panel:has(.mgrid){padding:17px 18px 15px}


/* Переработка контраста и графиков */
.slide.polished{--fc:#2DBE64;--fact:#D7144B;color:#202822}
.slide.polished .ch-panel{border-color:#E0E5E1;background:white}
.slide.polished .ch-head h2{color:#202822}
.slide.polished .ch-meta{color:#526158}
.slide.polished .mcard{background:#fff;border:1px solid #D9E1DA;border-top:4px solid #2DBE64;box-shadow:0 3px 12px #20352508;padding:14px 15px 12px}
.slide.polished .mcard:nth-child(2){border-top-color:#F4B942}
.slide.polished .mcard:nth-child(3){border-top-color:#2DBE64;background:#F0FAF3}
.slide.polished .mcard:nth-child(4){border-top-color:#D7144B}
.slide.polished .mt{font-size:15px;color:#242E27;font-weight:650}
.slide.polished .mrow{grid-template-columns:1fr;gap:2px;margin-top:8px;position:relative}
.slide.polished .mrow .k{padding:0;font-size:11px;color:#526158}
.slide.polished .mrow .sw{display:none}
.slide.polished .mvals{font-size:34px;font-weight:750;letter-spacing:-1px;color:#19231C;line-height:1.06}
.slide.polished .mvals .number-unit{font-size:16px;color:#39463D}
.slide.polished .mvals .value-secondary{font-size:14px;color:#46564B;margin-top:5px;letter-spacing:0}
.slide.polished .mvals.a{font-size:27px;color:#D7144B}
.slide.polished .mvals .wait{font-size:12px;color:#526158;background:#F0F2F0;padding:4px 8px}
.slide.polished .mdev{color:#526158;font-size:11px;padding-top:7px;line-height:1.25}
.slide.polished .mdev .wait{color:#526158}
.slide.polished .mgrid{gap:13px}
.slide.polished .mcard .mrow:nth-of-type(3){margin-top:10px}
.slide.polished .mcard{padding:12px 15px 10px}
.slide.polished .mt{min-height:20px}
.slide.polished .mrow,.slide.polished .mcard .mrow:nth-of-type(3){margin-top:6px}
.slide.polished .chart-shell{border:0;border-radius:0;padding:12px 14px 10px;box-shadow:none}
.slide.polished .chart-top .hint{font-size:12px;color:#46564B}
.slide.polished .legend{color:#34473B;font-size:13px}
.slide.polished .tip{color:#202822;border-color:#B9CCBF;font-size:14px;box-shadow:0 6px 25px #213a2920}


/* Факт после повышения */
.concl2{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:100%}
.cb{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 10px 34px rgba(51,51,51,.05)}
.cb-h{padding:20px 26px 18px;background:var(--green-ink);color:#fff}
.cb.b2 .cb-h{background:#1E6B41}
.cb-k{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#B9F0CD}
.cb-k span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:14px;letter-spacing:0}
.cb-h h3{margin:10px 0 0;font-size:24px;line-height:1.2;color:#fff}
.cb-v{margin-top:12px;font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1}
.cb-vs{margin-top:6px;font-size:14px;color:#D6F5E1}
.cb ul{flex:1;list-style:none;margin:0;padding:18px 26px 6px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.cb li{position:relative;padding-left:26px;font-size:17px;line-height:1.4;color:var(--ink2)}
.cb li:before{content:'';position:absolute;left:2px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--green)}
.cb li b{color:var(--ink);white-space:nowrap}
.cb-f{display:flex;align-items:center;gap:10px;margin:8px 20px 18px;padding:11px 16px;border-radius:14px;background:#FFF6E0;color:#6B5418;font-size:14.5px;font-weight:600}
.cb-f i{font-style:normal;font-size:18px}

.kgrid.two{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:100%}
.kgrid.two .kc{display:flex;flex-direction:column;justify-content:center;padding:14px 16px}
.kgrid.two .kv{font-size:24px;margin-top:6px}
.kgrid.two .kd{margin:2px 0 0;font-size:15px}
.kgrid.two .ks{margin-top:8px;line-height:1.35}
.two-ch.cat.call{height:calc(100% - 34px - 84px)}
.pick{display:grid;grid-template-columns:480px 1fr;gap:18px;height:calc(100% - 34px - 84px)}
.pick .ch-panel{padding:12px 18px;min-height:0}
.pick-list{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.pick-it{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:5px 10px;border:0;border-radius:10px;background:transparent;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.pick-it:hover{background:#F2F7F3}
.pick-it.on{background:var(--green-ink);color:#fff}
.pick-it .pn{font-size:13px;font-weight:600}
.pick-it .pn small{margin-left:8px;font-size:11.5px;font-weight:400;color:var(--muted)}
.pick-it .pv{font-size:13px;font-weight:700;white-space:nowrap}
.pick-it .pv em{font-style:normal;margin-left:8px;color:var(--muted)}
.pick-it .pv em.up{color:var(--berry)} .pick-it .pv em.dn{color:var(--green-d)}
.pick-it.on .pn small,.pick-it.on .pv em{color:#B9F0CD}
.pick-main{display:flex;flex-direction:column}
.pick-scroll{flex:1;min-height:0;overflow-y:auto}

.post-grid{display:grid;grid-template-columns:736px 1fr;gap:18px;height:418px}
.post-grid.tall{height:505px}
.post-grid .ch-panel{padding:16px 22px}
.post-side{display:flex;flex-direction:column;gap:12px;min-height:0}
.hero{border-radius:20px;padding:16px 20px;background:var(--green-ink);color:#fff}
.hero .hl{font-size:14px;opacity:.85}
.hero .hv{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.hero .hs{font-size:15px;opacity:.9}
.hero .hx{margin-top:8px;font-size:14px;color:#B9F0CD}
.hero .hx b{color:#fff}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.kc{border:1px solid var(--line);border-radius:16px;padding:10px 14px;background:#fff}
.kc.wide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 18px}
.kc .kt{font-size:12.5px;color:var(--muted)}
.kc .kv{font-size:22px;font-weight:700;color:var(--ink);margin-top:2px;white-space:nowrap}
.kc.wide .kv{font-size:28px}
.kc .ks{font-size:12px;color:var(--ink2);margin-top:2px}
.kc .kd{font-size:16px;font-weight:700;margin-left:6px}
.kc .kd.down{color:var(--berry)} .kc .kd.up{color:var(--green-d)}
.post-call{margin-top:14px;padding:12px 20px;font-size:16px}
.post-note{margin-top:8px;font-size:12px;color:var(--muted)}

/* Жалобы: карточки и выбор товара. Изменения оформления от 03.11.2026. */
.slide:has(#cpc) .kgrid.two{gap:12px}
.slide:has(#cpc) .kgrid.two .kc{justify-content:flex-start;padding:16px 15px 13px;border:1px solid #DCE6DF;border-radius:16px;background:#fff;box-shadow:none;border-top:3px solid #2DBE64}
.slide:has(#cpc) .kgrid.two .kc:nth-child(2){border-top-color:#D7144B}
.slide:has(#cpc) .kgrid.two .kc:nth-child(3){border-top-color:#93B79F}
.slide:has(#cpc) .kgrid.two .kc:nth-child(4){border-top-color:#D7144B}
.slide:has(#cpc) .kc .kt{font-size:13px;font-weight:550;line-height:1.3;color:#44564A;min-height:34px}
.slide:has(#cpc) .kgrid.two .kv{font-size:27px;line-height:1.1;font-weight:750;letter-spacing:-.5px;margin-top:10px;font-variant-numeric:tabular-nums}
.slide:has(#cpc) .kc .kv .before{font-weight:550;color:#617068}
.slide:has(#cpc) .kc .kv .arrow{font-size:20px;font-weight:400;color:#8CA395;padding:0 4px}
.slide:has(#cpc) .kc .kv .after{color:#202B23}
.slide:has(#cpc) .kgrid.two .kd{font-size:14px;font-weight:700;line-height:1.3;margin:7px 0 0;padding:3px 8px;border-radius:6px;align-self:flex-start;background:#FFF0F4;color:#C00F43}
.slide:has(#cpc) .kgrid.two .ks{font-size:12px;color:#526359;line-height:1.4;margin-top:auto;padding-top:11px}
.slide:has(.pick) .pick{grid-template-columns:330px minmax(0,1fr);gap:18px;height:calc(100% - 34px - 84px)}
.slide:has(.pick) .pick .ch-panel{border-radius:18px;border-color:#DFE8E1;box-shadow:none;padding:14px 16px}
.slide:has(.pick) .pick-list{gap:5px;scrollbar-width:thin;scrollbar-color:#B9CDBF #F4F7F4;padding:12px 10px}
.slide:has(.pick) .pick-it{padding:10px 11px;border-radius:10px;gap:8px;align-items:center;min-height:58px;flex-shrink:0}
.slide:has(.pick) .pick-it:not(.on):hover{background:#F0F8F2}
.slide:has(.pick) .pick-it .pn{font-size:13px;font-weight:600;line-height:1.25;flex:1;min-width:0}
.slide:has(.pick) .pick-it .pn small{display:block;margin:4px 0 0;font-size:11.5px;color:#607168;font-weight:400}
.slide:has(.pick) .pick-it .pv{font-size:12px;font-weight:650;line-height:1.25;text-align:right;font-variant-numeric:tabular-nums}
.slide:has(.pick) .pick-it .pv em{display:block;font-size:12px;margin:5px 0 0;font-weight:650}
.slide:has(.pick) .pick-it.on{background:#155C35;color:#fff}
.slide:has(.pick) .pick-it.on .pn small,.slide:has(.pick) .pick-it.on .pv em{color:#D8F0DF}
.slide:has(.pick) .pick-main{min-width:0}
.slide:has(.pick) .pick-main .ch-head{padding:2px 0 13px;margin-bottom:6px;border-bottom:1px solid #E6EDE7;align-items:flex-start}
.slide:has(.pick) .pick-main .ch-head h2{font-size:20px;color:#203A29;line-height:1.2;max-width:440px}
.slide:has(.pick) .pick-main .ch-meta{font-size:12px;color:#526459;max-width:230px;line-height:1.4}
.slide:has(.pick) .pick-scroll{scrollbar-width:thin;scrollbar-color:#B9CDBF #F4F7F4;padding-right:5px}
.slide:has(.pick) .chart-top .hint{color:#526459;font-size:12px}
.slide:has(.pick) .post-call{font-size:14.5px;line-height:1.4;border-radius:16px}
/* Выводы: контрастные цифры, ровные заголовки и спокойные пояснения. */
.slide:has(.concl2) .concl2{gap:20px}
.slide:has(.concl2) .cb{box-shadow:none;border:1px solid #DCE6DE;border-radius:20px;border-top:5px solid #2DBE64}
.slide:has(.concl2) .cb.b2{border-top-color:#D7144B}
.slide:has(.concl2) .cb-h,.slide:has(.concl2) .cb.b2 .cb-h{background:#fff;color:#202B23;padding:19px 24px 18px;border-bottom:1px solid #E4ECE6}
.slide:has(.concl2) .cb-k{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:#1A7440}
.slide:has(.concl2) .cb-k span{width:27px;height:27px;background:#E6F5EB;color:#166939;font-size:13px}
.slide:has(.concl2) .b2 .cb-k{color:#B61443}
.slide:has(.concl2) .b2 .cb-k span{color:#B61443;background:#FDEBF1}
.slide:has(.concl2) .cb-h h3{font-size:23px;line-height:1.22;font-weight:650;color:#202B23;margin:12px 0 0;min-height:56px;letter-spacing:-.3px}
.slide:has(.concl2) .cb-v{font-size:43px;line-height:1.05;letter-spacing:-1.1px;color:#174B2D;margin-top:16px;font-variant-numeric:tabular-nums}
.slide:has(.concl2) .b2 .cb-v{color:#C31247}
.slide:has(.concl2) .cb-vs{font-size:13px;line-height:1.4;color:#526359;margin-top:7px;max-width:475px}
.slide:has(.concl2) .cb ul{padding:19px 24px 14px;gap:17px;justify-content:flex-start}
.slide:has(.concl2) .cb li{padding-left:18px;font-size:15.5px;line-height:1.45;color:#425348}
.slide:has(.concl2) .cb li:before{left:0;top:8px;width:6px;height:6px;background:#2DBE64}
.slide:has(.concl2) .cb.b2 li:before{background:#D7144B}
.slide:has(.concl2) .cb li b{color:#202B23;white-space:normal;font-weight:700}
.slide:has(.concl2) .cb-f{margin:auto 19px 18px;padding:12px 14px;background:#F1F7F2;color:#365341;border-radius:11px;font-size:13px;line-height:1.4;font-weight:500;align-items:flex-start}
.slide:has(.concl2) .b2 .cb-f{background:#FFF1F5;color:#7C3148}
.slide:has(.concl2) .cb-f i{font-size:17px;line-height:1.2;color:#1C7844}
.slide:has(.concl2) .b2 .cb-f i{color:#BC1947}


.slide:has(.pick) .pick{height:calc(100% - 34px - 112px)}
.two-ch.cat.call{height:calc(100% - 34px - 112px)}
.slide:has(.pick) .pick-main .ch-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px;padding-bottom:10px;margin-bottom:0}
.slide:has(.pick) .pick-main .ch-head h2{font-size:19px;line-height:1.2;max-width:none;color:#203C2B;margin:0}
.product-category{font-size:12px;font-weight:500;color:#4F6A59;margin-top:5px;display:flex;align-items:center;gap:6px}
.product-category:before{content:'Категория:';color:#7B8D80;font-weight:400}
.product-chart-key{display:grid;grid-template-columns:57% minmax(0,1fr) 100px;gap:12px;align-items:center;padding:9px 17px 7px 0;color:#536D5D;font-size:11px;font-weight:600}
.product-chart-key span:last-child{text-align:left}
.slide:has(.pick) .pick-main .ch-meta{font-size:11.5px;max-width:none;white-space:nowrap;text-align:right}
.slide:has(.pick) .pick-scroll{border-top:1px solid #EFF3EF}


/* Зелёные выводы с явными переносами строк */
.callout.plain-takeaway{display:flex;gap:16px;align-items:center;background:#13532D;color:#fff;border:0;border-radius:18px;margin-top:12px;padding:12px 18px;font-size:14.5px;line-height:1.35}
.plain-takeaway .call-lines{display:grid;gap:4px;min-width:0}
.plain-takeaway .call-lines b{color:#D6F4DF;font-weight:700}
.plain-takeaway .ic{width:38px;height:38px;font-size:20px;background:#2DBE64;color:#fff}
.slide:has(#cpc) .kgrid.two .ks{font-size:12px;line-height:1.4;color:#4A6052;min-height:61px;padding-top:10px;margin-top:auto}
.slide:has(#cpc) .ks .caption-line{display:block}
.slide:has(#cpc) .ks strong{font-weight:650;color:#344D3D;white-space:nowrap}

</style>
</head>

  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function hbar(x0, x1, y, h, r){ r=Math.min(r, Math.abs(x1-x0), h/2);
  if(x1>=x0) return 'M'+x0+','+y+'H'+(x1-r)+'Q'+x1+','+y+' '+x1+','+(y+r)+'V'+(y+h-r)+'Q'+x1+','+(y+h)+' '+(x1-r)+','+(y+h)+'H'+x0+'Z';
  return 'M'+x0+','+y+'H'+(x1+r)+'Q'+x1+','+y+' '+x1+','+(y+r)+'V'+(y+h-r)+'Q'+x1+','+(y+h)+' '+(x1+r)+','+(y+h)+'H'+x0+'Z'; }
function tipOn(box, tip, ev, html){
  tip.innerHTML=html; tip.style.display='block';
  var bx=box.getBoundingClientRect(), sc=bx.width/box.offsetWidth||1;
  var left=(ev.clientX-bx.left)/sc+14, top=(ev.clientY-bx.top)/sc-10;
  if(left+tip.offsetWidth>box.offsetWidth) left-=tip.offsetWidth+28;
  if(top+tip.offsetHeight>box.offsetHeight) top=box.offsetHeight-tip.offsetHeight;
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
function sw(c){ return '<span class="sw" style="background:'+c+'"></span>'; }

/* Категории строками, одна или несколько панелей «прогноз / факт».
   rows: [{name, meta}] — meta мелко под названием;
   panels: [{title?, get(name)->{fc,fa,sub}|null, fmt, tfmt, kind, k}] — sub мелко под значением;
   domain: общий масштаб {lo,hi,st} (иначе свой у каждой панели) */
function catDomain(rows, panels){
  var v=[0]; panels.forEach(function(p){ rows.forEach(function(r){ var d=p.get(r.name); if(!d) return;
    v.push(d.fc*p.k); if(isNum(d.fa)) v.push(d.fa*p.k); }); });
  var lo=Math.min.apply(null,v), hi=Math.max.apply(null,v), st=niceStep(Math.max(hi-lo,1e-9),4);
  return {lo:Math.floor(lo/st)*st, hi:Math.ceil(hi/st)*st, st:st};
}
function multiChart(box,o){
 var rows=o.rows,n=rows.length,P=o.panels.length,W=o.width,LW=226,top=41,bot=29,H=o.height,rh=(H-top-bot)/n,PW=(W-LW)/P;
 var svg=el('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H},box),tip=document.createElement('div');tip.className='tip';
 var measure=document.createElement('canvas').getContext('2d');measure.font='500 13px "Segoe UI",Arial';
 rows.forEach(function(r,i){var yc=top+(i+.5)*rh,words=r.name.split(' '),lines=[],line='';
  words.forEach(function(w){var s=(line?line+' ':'')+w;if(line&&measure.measureText(s).width>207){lines.push(line);line=w}else line=s});if(line)lines.push(line);
  var t=txt(svg,2,yc+4,'',{'font-size':13,'font-weight':500,fill:'#242E27'});lines.forEach(function(s,j){var sp=el('tspan',{x:2,y:yc+4+(j-(lines.length-1)/2)*12},t);sp.textContent=s});el('title',{},t).textContent=r.name+(r.meta?' · '+r.meta:'');
 });
 o.panels.forEach(function(p,pi){var px=LW+pi*PW,bx0=px+18,bx1=px+PW-65,base=o.domain||catDomain(rows,[p]),span=base.hi-base.lo;
  var lo=base.lo<0?base.lo-span*.09:0,hi=base.hi>0?base.hi+span*.12:0;
  var X=function(v){return bx0+(v-lo)/(hi-lo)*(bx1-bx0)};
  txt(svg,px+18,20,p.title||'',{'font-size':P===3?15:20,'font-weight':650,fill:'#202822'});
  el('line',{x1:px+18,y1:29,x2:px+PW-18,y2:29,stroke:'#2DBE64','stroke-width':2},svg);
  for(var v=base.lo;v<=base.hi+base.st*.001;v+=base.st){var zero=Math.abs(v)<base.st*.001;
   el('line',{x1:X(v),x2:X(v),y1:top,y2:H-bot,stroke:zero?'#8FA99A':'#E8EEE9','stroke-width':zero?1.2:.8,'stroke-dasharray':zero?'':'2 5'},svg);
   txt(svg,X(v),H-7,zero?'0':num(v,p.axisDec||0)+(p.tick||''),{'text-anchor':'middle','font-size':11,fill:'#53695B'});
  }
  rows.forEach(function(r,i){var d=p.get(r.name),yc=top+(i+.5)*rh;if(!d)return;var has=isNum(d.fa),f=d.fc*p.k,a=has?d.fa*p.k:null;
   function bar(v,y,height,color,value){var xx=X(v);el('path',{d:hbar(X(0),xx,y-height/2,height,3),fill:color},svg);txt(svg,xx+(v<0?-6:6),y+4,value,{'text-anchor':v<0?'end':'start','font-size':has?12.5:14,'font-weight':650,fill:color===C.fact?'#AA123C':'#242E27'});}
   if(has){bar(f,yc-6,7,C.fc,p.fmt(d.fc));bar(a,yc+6,7,C.fact,p.fmt(d.fa))}else bar(f,yc,12,C.fc,p.fmt(d.fc));
   var hit=el('rect',{x:px,y:yc-rh/2,width:PW,height:rh,fill:'transparent'},svg);hit.addEventListener('mousemove',function(ev){var dv=dev(d.fc,d.fa,p.kind),tf=p.tfmt||p.fmt;
    tipOn(box,tip,ev,'<b>'+esc(r.name)+' · '+esc(p.title||'')+'</b><br>'+sw(C.fc)+'Прогноз: <b>'+tf(d.fc)+'</b><br>'+sw(C.fact)+'Факт: <b>'+(has?tf(d.fa):'ожидается')+'</b>'+(has?'<br>Отклонение: <b>'+dv.t+'</b>':'')+(d.tip?'<br>'+esc(d.tip):r.meta?'<br>Товаров с новой ценой · изменение цены: '+esc(r.meta):''));});hit.addEventListener('mouseleave',function(){tip.style.display='none'});
  });
 });box.style.position='relative';box.appendChild(tip);
}

/* Вертикальные столбики (переоценка по дням) */
function colChart(box, o){
  var W=o.width, H=o.height, m={l:10,r:10,t:26,b:30}, iw=W-m.l-m.r, ih=H-m.t-m.b, n=o.items.length;
  var hi=Math.max.apply(null,o.items.map(function(d){return d.v;}))*1.08, bw=iw/n;
  var Y=function(v){ return m.t+ih-v/hi*ih; };
  var svg=el('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H},null);
  el('line',{x1:m.l,x2:W-m.r,y1:Y(0),y2:Y(0),stroke:C.axis},svg);
  o.items.forEach(function(d,i){
    var w=Math.min(46,bw*.55), x=m.l+i*bw+(bw-w)/2;
    if(d.v) el('rect',{x:x,y:Y(d.v),width:w,height:Y(0)-Y(d.v),rx:4,fill:d.c||C.green},svg);
    txt(svg,x+w/2,Y(d.v)-7,d.v?num(d.v,0):'—',{'text-anchor':'middle',fill:C.ink,'font-size':12.5,'font-weight':600});
    txt(svg,x+w/2,H-9,d.k,{'text-anchor':'middle',fill:C.muted,'font-size':12});
  });
  box.style.position='relative'; box.appendChild(svg);
}

// ─── тестовый факт ─────────────────────────────────────────────────────────
function makeDemo(){
  var s=7; function rnd(){ s=(s*16807)%2147483647; return s/2147483647; }
  function sc(o){ var r={}, k=0.55+rnd()*0.65;
    ['rev_rub','rev_pct','gm_rub','gm_pct','share_pp'].forEach(function(f){ if(isNum(o[f])) r[f]=o[f]*(k+(rnd()-.5)*.1); });
    if(isNum(o.price_pct)) r.price_pct=o.price_pct*(0.9+rnd()*0.2);
    if(isNum(o.units_pct)) r.units_pct=o.units_pct*(0.7+rnd()*1.2);
    if(isNum(o.units)) r.units=o.units*(0.7+rnd()*1.2);
    return r; }
  var cats={}; FC.cats.forEach(function(c){ var on=sc(c.online), off=sc(c.offline), t=sc(c.total);
    ['rev_rub','gm_rub'].forEach(function(f){ t[f]=(on[f]||0)+(off[f]||0); }); cats[c.name]={online:on, offline:off, total:t}; });
  return {totals:{online:sc(FC.totals.online), offline:sc(FC.totals.offline)}, cats:cats};
}

// ═══ навигация: слайды друг под другом, содержание слева ═══════════════════
var main=document.getElementById('main'), navList=document.getElementById('navList'), side=document.getElementById('side');
document.getElementById('sideLogo').src=A.logo;
var wraps=[], items=[], cur=0;
function render(){
  SLIDES=[]; curGroup=''; define();
  main.innerHTML=''; navList.innerHTML=''; wraps=[]; items=[]; var lastGroup=null;
  SLIDES.forEach(function(s,i){
    var wrap=document.createElement('div'); wrap.className='sl-wrap';
    var holder=document.createElement('div'); holder.className='deck'; holder.appendChild(frame(s,i)); wrap.appendChild(holder);
    main.appendChild(wrap); wraps.push(wrap);
    if(s.group && s.group!==lastGroup){ var g=document.createElement('div'); g.className='nav-group'; g.textContent=s.group; navList.appendChild(g); lastGroup=s.group; }
    var it=document.createElement('button'); it.className='nav-item'; it.title=s.title;
    it.innerHTML='<span class="nav-num">'+(i+1)+'</span><span class="nav-label">'+esc(s.title)+'</span>';
    it.onclick=function(){ go(i); }; navList.appendChild(it); items.push(it);
  });
  var pad=document.createElement('div'); pad.className='sl-pad'; main.appendChild(pad);
  wraps.forEach(function(wr){ var sec=wr.firstChild.firstChild, b=sec.querySelector('.body'), H=720;
    if(b && b.scrollHeight>b.clientHeight+2) H=720+(b.scrollHeight-b.clientHeight)+12;
    wr.H=H; wr.firstChild.style.height=H+'px'; sec.style.height=H+'px'; });
  document.getElementById('demo').classList.toggle('on',DEMO);
}
function fit(){
  var w=main.clientWidth, h=main.clientHeight; if(!w||!h) return;
  var k=Math.min((w-32)/1280,(h-32)/720); if(!(k>0)) return;
  wraps.forEach(function(wr){ wr.style.width=(1280*k)+'px'; wr.style.height=((wr.H||720)*k)+'px'; wr.style.margin='16px auto 0';
    wr.firstChild.style.transform='scale('+k+')'; });
}
function setActive(i){
  cur=i; items.forEach(function(it,j){ it.classList.toggle('active',j===i); });
  document.getElementById('progress').style.width=((i+1)/wraps.length*100)+'%';
  var a=items[i], top=a.offsetTop, nl=navList;
  if(top<nl.scrollTop+40||top>nl.scrollTop+nl.clientHeight-60) nl.scrollTop=top-nl.clientHeight/2;
  try{ history.replaceState(null,'','#'+(i+1)); }catch(e){}
}
function go(i, instant){ i=Math.max(0,Math.min(wraps.length-1,i));
  var wr=wraps[i], y=wr.offsetHeight>main.clientHeight-32 ? wr.offsetTop-16 : wr.offsetTop-(main.clientHeight-wr.offsetHeight)/2;
  main.scrollTo({top:Math.max(0,y),behavior:instant?'instant':'smooth'}); setActive(i); }
var ticking=false, booted=false;
main.addEventListener('scroll',function(){ if(ticking) return; ticking=true; requestAnimationFrame(function(){
  ticking=false; var mid=main.scrollTop+main.clientHeight/2, best=0, bd=1e9;
  wraps.forEach(function(wr,j){ var d=(mid>=wr.offsetTop&&mid<=wr.offsetTop+wr.offsetHeight)?-1:Math.abs(wr.offsetTop+wr.offsetHeight/2-mid); if(d<bd){bd=d;best=j;} });
  if(booted&&best!==cur) setActive(best); }); });
if(window.ResizeObserver) new ResizeObserver(function(){ fit(); }).observe(main);
document.getElementById('navToggle').onclick=function(){ side.classList.toggle('collapsed'); document.body.classList.toggle('nav-collapsed'); setTimeout(fit,280); };
document.getElementById('fs').onclick=function(){ var d=document.documentElement; if(!document.fullscreenElement){ (d.requestFullscreen||function(){}).call(d); } else document.exitFullscreen(); };
document.getElementById('pr').onclick=function(){ window.print(); };
document.getElementById('demo').onclick=function(){ DEMO=!DEMO; FACT=DEMO?makeDemo():REAL; var c=cur; render(); fit(); go(c,true); };
document.addEventListener('keydown',function(e){
  var w=wraps[cur], st=main.scrollTop, vh=main.clientHeight;
  if(['ArrowDown','PageDown',' ','ArrowRight'].indexOf(e.key)>=0){ e.preventDefault();
    if(w && w.offsetTop+w.offsetHeight>st+vh+4) main.scrollTo({top:Math.min(st+vh*0.8, w.offsetTop+w.offsetHeight-vh+16),behavior:'smooth'}); else go(cur+1); }
  else if(['ArrowUp','PageUp','ArrowLeft'].indexOf(e.key)>=0){ e.preventDefault();
    if(w && w.offsetTop<st-20) main.scrollTo({top:Math.max(st-vh*0.8, w.offsetTop-16),behavior:'smooth'}); else go(cur-1); }
  else if(e.key==='Home'){ e.preventDefault(); go(0); } else if(e.key==='End'){ e.preventDefault(); go(wraps.length-1); }
  else if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А') document.getElementById('fs').click();
});
window.addEventListener('resize',fit);
var h0=parseInt((location.hash||'').slice(1),10);
render();
if(window.innerWidth<900){ side.classList.add('collapsed'); document.body.classList.add('nav-collapsed'); }
fit(); setActive(0);
function boot(){ fit(); go(isNaN(h0)?0:h0-1, true); setTimeout(function(){ booted=true; },400); }
boot(); window.addEventListener('load',boot);
})();
</script>
